<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTT (Dials & Talk Time) Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .heat-low { background-color: #fee2e2; color: #991b1b; }
        .heat-med { background-color: #ffedd5; color: #9a3412; }
        .heat-high { background-color: #dcfce7; color: #166534; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md py-6 px-8 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">DTT Calculator</h1>
                <p class="text-slate-400 text-sm mt-1">Dials and Talk Time Tracker • Formula: <code class="bg-slate-800 px-2 py-0.5 rounded text-amber-300">(duration / 60) + 1</code></p>
            </div>
            <div id="statsBadge" class="hidden bg-slate-800 px-4 py-2 rounded-lg text-right">
                <span class="text-xs text-slate-400 block uppercase tracking-wider font-semibold">Total Logs</span>
                <span id="totalCallCount" class="text-lg font-bold text-emerald-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16">

        <!-- File Upload Section -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:border-indigo-500 transition-colors cursor-pointer bg-slate-50 hover:bg-indigo-50/30">
                <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
                <svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <h3 class="text-base font-semibold text-slate-700">Click to upload or drag & drop call log CSV</h3>
                <p class="text-xs text-slate-500 mt-1">Supports standard CSV reports containing User Name, Duration, and Date columns</p>
                <p id="fileNameDisplay" class="text-sm font-medium text-indigo-600 mt-3 hidden"></p>
            </div>
        </section>

        <!-- Filters & Controls -->
        <section id="controlsSection" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8 hidden">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Start Date</label>
                    <input type="date" id="startDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">End Date</label>
                    <input type="date" id="endDate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Search Rep</label>
                    <input type="text" id="searchRep" placeholder="Filter by rep name..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex gap-2">
                    <button id="resetFiltersBtn" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-3 rounded-lg text-sm transition">Reset</button>
                    <button id="exportBtn" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-3 rounded-lg text-sm transition flex items-center justify-center gap-1">
                        <span>Export Excel</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Pivot Table Output -->
        <section id="tableSection" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hidden">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h2 class="font-semibold text-slate-800">DTT Summary Matrix</h2>
                <span class="text-xs text-slate-500">Values shown in calculated DTT minutes</span>
            </div>
            <div class="overflow-x-auto">
                <table id="dttTable" class="w-full text-sm text-left border-collapse">
                    <thead id="tableHead" class="bg-slate-100 text-slate-700 uppercase text-xs font-semibold border-b border-slate-200">
                        <!-- Dynamic Headers -->
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <!-- Dynamic Content -->
                    </tbody>
                    <tfoot id="tableFoot" class="bg-slate-100 font-bold border-t-2 border-slate-300 text-slate-900">
                        <!-- Dynamic Totals -->
                    </tfoot>
                </table>
            </div>
        </section>

    </main>

    <script>
        let rawCallData = [];
        let parsedDates = [];
        let repDataMap = {};

        const dropZone = document.getElementById('dropZone');
        const csvFileInput = document.getElementById('csvFileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const controlsSection = document.getElementById('controlsSection');
        const tableSection = document.getElementById('tableSection');
        const statsBadge = document.getElementById('statsBadge');

        dropZone.addEventListener('click', () => csvFileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-indigo-50/50'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50/50');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        csvFileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

        function handleFile(file) {
            fileNameDisplay.textContent = `Loaded file: ${file.name}`;
            fileNameDisplay.classList.remove('hidden');

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processCSVData(results.data);
                }
            });
        }

        function processCSVData(data) {
            rawCallData = [];
            
            data.forEach(row => {
                // Extract Rep Name (User First Name + User Last Name)
                let firstName = row['User First Name'] || row['User FirstName'] || '';
                let lastName = row['User Last Name'] || row['User LastName'] || '';
                let repName = `${firstName}${lastName}`.trim();

                if (!repName) {
                    repName = row['Prospect Owner Name'] || row['User Name'] || 'Unknown Rep';
                }

                // Extract Duration
                let durationSec = parseFloat(row['Duration in Seconds'] || row['Duration'] || 0);
                if (isNaN(durationSec)) durationSec = 0;

                // Extract Date
                let dateStr = row['Created At'] || row['Completed At'] || row['Date'] || '';
                let parsedDate = parseDateString(dateStr);

                if (repName && parsedDate) {
                    // DTT Formula: (duration / 60) + 1
                    let dtt = (durationSec / 60.0) + 1.0;

                    rawCallData.push({
                        rep: repName,
                        date: parsedDate, // Format YYYY-MM-DD
                        dtt: dtt
                    });
                }
            });

            document.getElementById('totalCallCount').textContent = rawCallData.length.toLocaleString();
            statsBadge.classList.remove('hidden');
            controlsSection.classList.remove('hidden');
            tableSection.classList.remove('hidden');

            // Set min and max dates for date filters
            const dates = rawCallData.map(d => d.date).sort();
            parsedDates = [...new Set(dates)];

            if (parsedDates.length > 0) {
                document.getElementById('startDate').value = parsedDates[0];
                document.getElementById('endDate').value = parsedDates[parsedDates.length - 1];
            }

            renderMatrix();
        }

        function parseDateString(str) {
            if (!str) return null;
            let d = new Date(str);
            if (isNaN(d.getTime())) return null;
            return d.toISOString().split('T')[0];
        }

        function renderMatrix() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const searchRep = document.getElementById('searchRep').value.toLowerCase();

            // Filter active dates
            const activeDates = parsedDates.filter(d => (!startDate || d >= startDate) && (!endDate || d <= endDate));

            // Aggregate values
            const aggregated = {}; // rep -> date -> dttSum
            const repTotals = {};  // rep -> grandTotal

            rawCallData.forEach(item => {
                if (activeDates.includes(item.date) && item.rep.toLowerCase().includes(searchRep)) {
                    if (!aggregated[item.rep]) aggregated[item.rep] = {};
                    if (!aggregated[item.rep][item.date]) aggregated[item.rep][item.date] = 0;

                    aggregated[item.rep][item.date] += item.dtt;
                    repTotals[item.rep] = (repTotals[item.rep] || 0) + item.dtt;
                }
            });

            const sortedReps = Object.keys(aggregated).sort();

            // Build Table Header
            const thead = document.getElementById('tableHead');
            let headerHTML = `<tr><th class="py-3 px-4 text-left border-b">Reps</th>`;
            activeDates.forEach(d => {
                const formattedDate = new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
                headerHTML += `<th class="py-3 px-4 text-center border-b">${formattedDate}</th>`;
            });
            headerHTML += `<th class="py-3 px-4 text-center border-b bg-slate-200">Grand Total</th></tr>`;
            thead.innerHTML = headerHTML;

            // Build Table Body
            const tbody = document.getElementById('tableBody');
            let bodyHTML = '';
            const dateDailyTotals = {};
            activeDates.forEach(d => dateDailyTotals[d] = 0);
            let overallGrandTotal = 0;

            sortedReps.forEach(rep => {
                bodyHTML += `<tr class="hover:bg-slate-50 transition">`;
                bodyHTML += `<td class="py-2.5 px-4 font-medium text-slate-800">${rep}</td>`;

                activeDates.forEach(d => {
                    const val = aggregated[rep][d];
                    if (val !== undefined && val > 0) {
                        dateDailyTotals[d] += val;
                        // Simple dynamic background coloring
                        let heatClass = 'heat-low';
                        if (val > 30) heatClass = 'heat-med';
                        if (val > 60) heatClass = 'heat-high';

                        bodyHTML += `<td class="py-2.5 px-4 text-center font-mono text-xs ${heatClass}">${val.toFixed(2)}</td>`;
                    } else {
                        bodyHTML += `<td class="py-2.5 px-4 text-center font-mono text-xs text-slate-300">-</td>`;
                    }
                });

                const repTotal = repTotals[rep] || 0;
                overallGrandTotal += repTotal;
                bodyHTML += `<td class="py-2.5 px-4 text-center font-mono font-bold bg-slate-100 text-slate-900">${repTotal.toFixed(2)}</td>`;
                bodyHTML += `</tr>`;
            });

            tbody.innerHTML = bodyHTML || `<tr><td colspan="${activeDates.length + 2}" class="py-6 text-center text-slate-400">No data found matching current filters.</td></tr>`;

            // Build Table Footer
            const tfoot = document.getElementById('tableFoot');
            let footHTML = `<tr><td class="py-3 px-4 uppercase text-xs">Grand Total</td>`;
            activeDates.forEach(d => {
                footHTML += `<td class="py-3 px-4 text-center font-mono text-xs">${dateDailyTotals[d].toFixed(2)}</td>`;
            });
            footHTML += `<td class="py-3 px-4 text-center font-mono text-xs bg-slate-200">${overallGrandTotal.toFixed(2)}</td></tr>`;
            tfoot.innerHTML = footHTML;
        }

        // Event Listeners for Filters
        document.getElementById('startDate').addEventListener('change', renderMatrix);
        document.getElementById('endDate').addEventListener('change', renderMatrix);
        document.getElementById('searchRep').addEventListener('input', renderMatrix);

        document.getElementById('resetFiltersBtn').addEventListener('click', () => {
            if (parsedDates.length > 0) {
                document.getElementById('startDate').value = parsedDates[0];
                document.getElementById('endDate').value = parsedDates[parsedDates.length - 1];
            }
            document.getElementById('searchRep').value = '';
            renderMatrix();
        });

        // Excel Export
        document.getElementById('exportBtn').addEventListener('click', () => {
            const table = document.getElementById('dttTable');
            const wb = XLSX.utils.table_to_book(table, { sheet: "DTT Summary" });
            XLSX.writeFile(wb, "DTT_Summary_Report.xlsx");
        });
    </script>
</body>
</html>
